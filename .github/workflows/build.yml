name: build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Resolve latest Fabric versions for 1.21.1
        id: v
        run: |
          YARN=$(curl -s https://maven.fabricmc.net/net/fabricmc/yarn/maven-metadata.xml | grep -oE '<version>1\.21\.1\+build\.[0-9]+</version>' | sed -E 's#</?version>##g' | sort -t. -k4 -n | tail -1)
          API=$(curl -s https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/maven-metadata.xml | grep -oE '<version>[0-9.]+\+1\.21\.1</version>' | sed -E 's#</?version>##g' | sort -V | tail -1)
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[]|select(.stable)][0].version')
          echo "yarn=$YARN api=$API loader=$LOADER"
          echo "args=-Pyarn_mappings=$YARN -Pfabric_version=$API -Ploader_version=$LOADER" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace ${{ steps.v.outputs.args }} 2>&1 | tee build.log

      - name: Publish result to 'build' branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          cp build/libs/*.jar /tmp/out/ 2>/dev/null || true
          rm -f /tmp/out/*-sources.jar
          echo "${{ steps.build.outcome }}" > /tmp/out/STATUS
          echo "${{ github.sha }}" > /tmp/out/COMMIT
          git config user.name "build-bot"
          git config user.email "build-bot@users.noreply.github.com"
          git checkout --orphan build-out
          git rm -rf . > /dev/null
          rm -rf ./* .gradle build 2>/dev/null || true
          cp /tmp/out/* .
          git add -A
          git commit -m "Build ${{ github.sha }} (${{ steps.build.outcome }})"
          git push -f origin build-out:build

      - name: Fail if build failed
        if: steps.build.outcome != 'success'
        run: exit 1
